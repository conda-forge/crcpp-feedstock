schema_version: 1

context:
  name: libcrcpp
  version: "1.2.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/d-bahr/CRCpp/archive/refs/tags/release-${{ version }}.tar.gz
  sha256: 67889781c0137d52b571e083030a3d79bb2ac2ce8c6964ecb1e5bc58d72e2d72

build:
  number: 0
  script:
    - if: unix
      then:
        - cmake -G Ninja -S . -B build ${CMAKE_ARGS} -DCMAKE_INSTALL_PREFIX="${PREFIX}" -DCMAKE_INSTALL_INCLUDE_DIR=include -DBUILD_TEST=OFF
        - cmake --install build
    - if: win
      then:
        - cmake -G Ninja -S . -B build %CMAKE_ARGS% -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DCMAKE_INSTALL_INCLUDE_DIR=include -DBUILD_TEST=OFF
        - cmake --install build

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  # Header-only: the package ships no compiled artifacts, so it needs no
  # C/C++ runtime at run time. (noarch: generic used to suppress these.)
  ignore_run_exports:
    by_name:
      - libgcc
      - libstdcxx

tests:
  # Layout check. Runs everywhere, including cross-compiled targets, and is
  # what guards the %PREFIX% vs %PREFIX%\Library regression this recipe fixes.
  - package_contents:
      include:
        - CRC.h
      files:
        exists:
          - ${{ "Library/" if win }}share/cmake/crcpp/CRCppConfig.cmake
          - ${{ "Library/" if win }}share/pkgconfig/CRCpp.pc

  # The remaining tests compile and run a binary, so they only work when the
  # target is executable on the builder. macOS cannot run arm64 binaries on an
  # x86_64 runner (EBADARCH), so cross-compiled targets are skipped.
  - if: unix and target_platform == build_platform
    then:
      - script:
          - cmake -G Ninja -S . -B build ${CMAKE_ARGS} -DCMAKE_INSTALL_INCLUDE_DIR=include -DBUILD_TEST=ON
          - cmake --build build
          - ctest --test-dir build --output-on-failure
          # $LDFLAGS carries -Wl,-rpath,$PREFIX/lib; without it the binary
          # cannot locate libstdc++.so.6 when run under emulation.
          - ${CXX} ${CXXFLAGS} ${LDFLAGS} -std=c++11 -I"${PREFIX}/include" test.cpp -o crcpp-test
          - ./crcpp-test
        files:
          source:
            - CMakeLists.txt
            - cmake/
            - inc/
            - test/
          recipe:
            - test.cpp
        requirements:
          build:
            - ${{ compiler('cxx') }}
            - ${{ stdlib('c') }}
            - cmake
            - ninja
          # The test binary links a C++ runtime even though the package
          # itself ships none. On cross-compiled targets (aarch64, ppc64le)
          # the test runs under emulation, so the runtime must be present in
          # the test's run env -- the build env holds the wrong architecture.
          run:
            - if: linux
              then: libstdcxx
            - if: osx
              then: libcxx
  - if: win and target_platform == build_platform
    then:
      - script:
          - cmake -G Ninja -S . -B build %CMAKE_ARGS% -DCMAKE_INSTALL_INCLUDE_DIR=include -DBUILD_TEST=ON
          - cmake --build build
          - ctest --test-dir build --output-on-failure
          - '%CXX% /std:c++14 /I"%LIBRARY_PREFIX%\include" test.cpp /Fe:crcpp-test.exe'
          - crcpp-test.exe
        files:
          source:
            - CMakeLists.txt
            - cmake/
            - inc/
            - test/
          recipe:
            - test.cpp
        requirements:
          build:
            - ${{ compiler('cxx') }}
            - ${{ stdlib('c') }}
            - cmake
            - ninja

about:
  homepage: https://github.com/d-bahr/CRCpp
  repository: https://github.com/d-bahr/CRCpp
  summary: Header-only C++ library for CRC calculations
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  feedstock-name: crcpp
  recipe-maintainers:
    - swahtz
